# The operating system features of the NuttX build of FMU-v6XRT, to compare the footprint of
# the operating systems

# TCP, DHCP (without waiting for it at boot), DNS, IGMP, and the shell over telnet with its
# network commands
CONFIG_NET_TCP=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_NET_SHELL=y
CONFIG_NET_SHELL_SHOW_DISABLED_COMMANDS=n

# no log messages from the subsystems, which have no debug output in the NuttX build
CONFIG_LOG_MAX_LEVEL=0
