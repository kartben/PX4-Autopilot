sample:
  name: PX4 Autopilot
  description: PX4 running on Zephyr
common:
  tags:
    - px4
tests:
  px4.app:
    platform_allow:
      - mps2/an386
    integration_platforms:
      - mps2/an386
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "HW arch: ZEPHYR_GENERIC"
        - "OS: Zephyr"
  px4.app.sih:
    platform_allow:
      - mps2/an386
    integration_platforms:
      - mps2/an386
    extra_args:
      - FILE_SUFFIX=sih
    timeout: 600
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_sih.py"
      pytest_dut_scope: session
  px4.app.sih.mavlink_serial:
    platform_allow:
      - mps2/an386
    integration_platforms:
      - mps2/an386
    extra_args:
      - FILE_SUFFIX=sih
      - EXTRA_CONF_FILE=boards/mps2_an386_serial.conf
      - EXTRA_DTC_OVERLAY_FILE=boards/mps2_an386_serial.overlay
    timeout: 600
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_mavlink_serial.py"
      pytest_dut_scope: session
  px4.app.vmu_rt1170:
    build_only: true
    platform_allow:
      - vmu_rt1170/mimxrt1176/cm7
    integration_platforms:
      - vmu_rt1170/mimxrt1176/cm7
  px4.app.sih.vmu_rt1170:
    build_only: true
    platform_allow:
      - vmu_rt1170/mimxrt1176/cm7
    integration_platforms:
      - vmu_rt1170/mimxrt1176/cm7
    extra_args:
      - FILE_SUFFIX=sih
