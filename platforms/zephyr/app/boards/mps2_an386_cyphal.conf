CONFIG_PX4_BOARD_CONFIG="zephyr_generic_cyphal"
CONFIG_CAN_SHELL=y
# the frames of a multi-frame transfer, printed by the CAN shell
CONFIG_CAN_SHELL_RX_QUEUE_SIZE=32
# the loopback controller calls the PX4 callbacks from its transmit thread
CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=1024
# received frames printed as whole lines, without the prompt
CONFIG_CAN_SHELL_SCRIPTING_FRIENDLY=y
