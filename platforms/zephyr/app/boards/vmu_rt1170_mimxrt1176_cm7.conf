# the 100 kHz kernel tick of PX4, which needs the tickless kernel that the board disables
CONFIG_TICKLESS_KERNEL=y

# USB serial port, with the USB IDs of the FMUv6X-RT
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0x3643
CONFIG_CDC_ACM_SERIAL_PID=0x001d
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Dronecode Project, Inc."
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="PX4 FMU v6XRT.x"
# the CDC ACM class logs every transfer at the info level
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# smart batteries on POWER1 and POWER2
CONFIG_FUEL_GAUGE=y

# the FIFO reads of the IMUs over SPI RTIO by interrupts: its DMA brings no gain, and it stops when it
# writes to the DTCM, where the RTIO buffers are by default
CONFIG_SPI_NXP_LPSPI_RTIO_DMA=n

# the FIFOs of the BMI088, with the watermarks of the overlay
CONFIG_BMI08X_ACCEL_STREAM=y
CONFIG_BMI08X_GYRO_STREAM=y

# PX4 is built for speed, instead of -Os, as the VMU RT1170 has 64 MiB of flash
CONFIG_SPEED_OPTIMIZATIONS=y

# the code that runs most, from the ITCM instead of the flash
CONFIG_PX4_ITCM=y
CONFIG_PX4_ITCM_FUNCTIONS="itcm_functions_vmu_rt1170.ld"
CONFIG_PX4_ITCM_RESERVE=98304
CONFIG_PX4_ITCM_FILL=95

# started by the PX4 bootloader of FMU-v6XRT from slot0_partition, its APP_LOAD_ADDRESS, with the vector
# table after the boot header, its APP_VECTOR_OFFSET
CONFIG_USE_DT_CODE_PARTITION=y
# the MPU, interrupts and caches that the bootloader leaves on
CONFIG_INIT_ARCH_HW_AT_BOOT=y
