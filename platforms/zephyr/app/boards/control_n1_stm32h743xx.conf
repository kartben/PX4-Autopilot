# USB serial port, with the USB IDs of the NuttX build
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0x26ac
CONFIG_CDC_ACM_SERIAL_PID=0x1186
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="3DR"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="3DRControlN1"
# the CDC ACM class logs every transfer at the info level
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
