# USB serial port
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="PX4 MIMXRT1170-EVK"
# the CDC ACM class logs every transfer at the info level
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# the firmware runs from a quad SPI flash
CONFIG_PX4_ITCM=y

# PX4 is built for speed, instead of -Os, as the MIMXRT1170-EVK has 64 MiB of flash
CONFIG_SPEED_OPTIMIZATIONS=y
