# the RAM of the application, OCRAM1, has 512 KiB
CONFIG_HEAP_MEM_POOL_SIZE=262144

# USB serial port, with the USB IDs of the FMUv6X-RT
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0x3643
CONFIG_CDC_ACM_SERIAL_PID=0x001d
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Dronecode Project, Inc."
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="PX4 FMU v6XRT.x"
