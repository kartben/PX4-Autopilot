CONFIG_PX4=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_PX4_BOARD_CONFIG="zephyr_generic_sih"
# no zephyr_rc_input in zephyr_generic_sih
CONFIG_PX4_RC_INPUT=n
# no board_adc in zephyr_generic_sih
CONFIG_PX4_ADC=n
# no tone_alarm in zephyr_generic_sih
CONFIG_PX4_BUZZER=n
# no safety_button in zephyr_generic_sih
CONFIG_PX4_SAFETY_BUTTON=n
CONFIG_HEAP_MEM_POOL_SIZE=1048576

CONFIG_NETWORKING=y
CONFIG_ETH_DRIVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_XSI_STREAMS=y
