CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_PX4=y
CONFIG_PX4_BOARD_CONFIG="zephyr_generic"
CONFIG_EMUL=y
# the ICM-42688 emulator of the test has a FIFO, which the driver streams with RTIO
CONFIG_EMUL_ICM4268X=n
CONFIG_SPI_RTIO=y
CONFIG_FUEL_GAUGE=y
# the sensor emulators log their reads, many times a second
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_SENSOR_LOG_LEVEL_OFF=y
