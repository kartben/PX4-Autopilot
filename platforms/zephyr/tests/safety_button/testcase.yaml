common:
  tags:
    - px4
  platform_allow:
    - mps2/an386
    - mimxrt1170_evk@A/mimxrt1176/cm7
    - mimxrt1170_evk@B/mimxrt1176/cm7
  integration_platforms:
    - mps2/an386
tests:
  px4.safety_button: {}
  # a board without a safety LED, nor the gpio-keys input driver
  px4.safety_button.no_led:
    extra_dtc_overlay_files:
      - app.overlay
      - no_led.overlay
    extra_configs:
      - CONFIG_INPUT=n
