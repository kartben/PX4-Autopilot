description: |
  LEDs of PX4.

  The board LEDs are the LEDs that PX4 turns on and off with led_on(),
  led_off() and led_toggle(), and through /dev/led0, for example to show
  the armed state and the CPU overload with Commander. Each one is named
  after its PX4 LED: blue for LED_BLUE, red for LED_RED and LED_AMBER, and
  green for LED_GREEN.

  The RGB LEDs are multi-color LEDs with red, green or blue channels, on
  which the PX4 zephyr_rgbled driver shows the system status, for example
  the LED of an NCP5623C on a GPS module, or a leds-group-multicolor of
  single-color LEDs.

  Each LED is a child node of an LED controller, such as gpio-leds or
  pwm-leds, or a leds-group-multicolor:

    / {
      px4-leds {
        compatible = "px4,leds";
        blue = <&blue_led>;
        red = <&red_led>;
        green = <&green_led>;
        rgb = <&gps_led>;
      };
    };

compatible: "px4,leds"

properties:
  blue:
    type: phandle
    description: LED_BLUE.
  red:
    type: phandle
    description: LED_RED, also LED_AMBER.
  green:
    type: phandle
    description: LED_GREEN.
  rgb:
    type: phandles
    description: RGB LEDs, which all show the system status.
